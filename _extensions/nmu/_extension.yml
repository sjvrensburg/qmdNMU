title: NMU Templates
author: Faculty of Sciences
version: 0.1.0
quarto-required: ">=1.5.0"
contributes:
  formats:
    typst:
      template-partials:
        - typst-template.typ
        - typst-show.typ
      filters:
        - instructor.lua
      format-resources:
        - _brand.typ
        - _mosaic.typ
        - _assessment.typ
        - assets
      toc: false
      number-sections: true
      papersize: a4
      mainfont: Nunito Sans
