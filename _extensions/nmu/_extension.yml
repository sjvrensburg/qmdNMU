title: NMU Templates
author: Faculty of Sciences
version: 0.1.0
quarto-required: ">=1.5.0"
contributes:
  formats:
    typst:
      template-partials:
        - typst-template.typ
        - typst-show.typ
      filters:
        - columns.lua
        - instructor.lua
        - beat.lua
      format-resources:
        - _brand.typ
        - _mosaic.typ
        - _assessment.typ
        - assets
      toc: false
      number-sections: true
      papersize: a4
      mainfont: Nunito Sans
      # Quarto auto-shifts heading levels so the shallowest level used becomes 1
      # (e.g. a doc that only uses `##` gets it promoted to level 1). For slides
      # that breaks the `#`-divider / `##`-content-slide distinction whenever a
      # deck happens not to use `#` at all. Pin levels to their literal markdown
      # depth so `##` is always a content slide, `#` always a divider.
      shift-heading-level-by: 0
